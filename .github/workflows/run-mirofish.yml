name: Run MiroFish on GitHub Compute

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: 'GitHub Environment to use for secrets'
        required: false
        default: 'mirofish'
        type: string
      tunnel_mode:
        description: 'Tunnel provider for web access'
        required: true
        default: 'cloudflare'
        type: choice
        options:
          - cloudflare
          - pinggy
          - none
      run_duration_hours:
        description: 'How many hours to keep the instance running (1 to 5 hours)'
        required: true
        default: '2'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'

concurrency:
  group: mirofish-runner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-mirofish:
    name: MiroFish Cloud Runner
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name || 'mirofish' }}
    timeout-minutes: 360

    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://openrouter.ai/api/v1' }}
      LLM_MODEL_NAME: ${{ secrets.LLM_MODEL_NAME || 'deepseek/deepseek-chat' }}
      ZEP_API_KEY: ${{ secrets.ZEP_API_KEY }}
      FLASK_HOST: '0.0.0.0'
      FLASK_PORT: 5001

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install uv (Fast Python Package Manager)
        uses: astral-sh/setup-uv@v5
        with:
          version: 'latest'

      - name: Configure Environment & Validate Secrets
        run: |
          echo "📝 Creating .env file from GitHub Secrets..."
          cat <<EOF > .env
          LLM_API_KEY=${LLM_API_KEY}
          LLM_BASE_URL=${LLM_BASE_URL}
          LLM_MODEL_NAME=${LLM_MODEL_NAME}
          ZEP_API_KEY=${ZEP_API_KEY}
          FLASK_HOST=0.0.0.0
          FLASK_PORT=5001
          EOF

          if [ -z "$LLM_API_KEY" ] || [ -z "$ZEP_API_KEY" ]; then
            echo "::error::❌ LLM_API_KEY or ZEP_API_KEY is EMPTY!"
            echo ""
            echo "======================================================================="
            echo "⚠️ SECRETS NOT FOUND BY GITHUB ACTIONS"
            echo "Why this happened:"
            echo "You saved secrets inside an 'Environment' (e.g. production/test/etc.),"
            echo "but ran the workflow without specifying that environment name, OR"
            echo "they need to be added as 'Repository Secrets'."
            echo "======================================================================="
            exit 1
          fi
          echo "✅ Secrets successfully loaded and .env generated."

      - name: Install Dependencies
        run: |
          echo "📦 Installing root & frontend dependencies..."
          npm ci || npm install
          cd frontend && (npm ci || npm install) && cd ..
          
          echo "🐍 Installing backend dependencies with uv..."
          cd backend && uv sync && cd ..

      - name: Restore Persistent Data (Projects, Simulations, Reports)
        uses: actions/cache/restore@v4
        with:
          path: backend/uploads
          key: mirofish-data-${{ github.run_id }}
          restore-keys: |
            mirofish-data-

      - name: Start MiroFish Services (Backend & Frontend)
        run: |
          echo "🚀 Starting MiroFish Backend on port 5001..."
          cd backend
          nohup uv run python run.py > ../backend.log 2>&1 &
          cd ..

          echo "🚀 Starting MiroFish Frontend on port 3000..."
          cd frontend
          nohup npm run dev -- --host 0.0.0.0 --port 3000 > ../frontend.log 2>&1 &
          cd ..

          echo "⏳ Waiting for services to initialize..."
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null && curl -s http://localhost:5001 > /dev/null; then
              echo "✅ Services are up and healthy!"
              break
            fi
            sleep 2
          done

      - name: Launch Public Web Tunnels (Cloudflare & Pinggy)
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          echo "🌐 Setting up public access tunnels..."
          
          # 1. Cloudflare Tunnel
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          
          if [ -n "$CLOUDFLARE_TUNNEL_TOKEN" ]; then
            echo "🔑 Starting Named Cloudflare Tunnel..."
            ./cloudflared tunnel run --token "$CLOUDFLARE_TUNNEL_TOKEN" > cf.log 2>&1 &
          else
            echo "⚡ Starting Cloudflare Quick Tunnel..."
            ./cloudflared tunnel --url http://localhost:3000 --no-autoupdate > cf.log 2>&1 &
          fi

          # 2. Pinggy Tunnel (Fast alternative with zero DNS delay)
          echo "⚡ Starting Pinggy Tunnel..."
          ssh -p 443 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R0:localhost:3000 a.pinggy.io > pinggy.log 2>&1 &

          # 3. Localtunnel (Backup instant link)
          echo "⚡ Starting Localtunnel..."
          npx -y localtunnel --port 3000 > lt.log 2>&1 &

          echo "⏳ Gathering live tunnel links..."
          sleep 8

          CF_URL=""
          for i in {1..15}; do
            CF_URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' cf.log | head -n 1 || true)
            if [ -n "$CF_URL" ]; then break; fi
            sleep 2
          done

          PINGGY_URL=$(grep -o 'https://[a-zA-Z0-9\.-]*\.pinggy\.link' pinggy.log | head -n 1 || true)
          LT_URL=$(grep -o 'https://[a-zA-Z0-9-]*\.loca\.lt' lt.log | head -n 1 || true)

          echo "================================================================="
          echo "🎉 MIROFISH IS LIVE ON GITHUB COMPUTE!"
          if [ -n "$CF_URL" ]; then echo "👉 Primary Link (Cloudflare): $CF_URL"; fi
          if [ -n "$PINGGY_URL" ]; then echo "👉 Alternate Link (Pinggy):     $PINGGY_URL"; fi
          if [ -n "$LT_URL" ]; then echo "👉 Alternate Link (Localtunnel): $LT_URL"; fi
          echo "================================================================="

          echo "### 🐟 MiroFish is Running on GitHub Compute!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Choose any working link below to open the Web UI:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -n "$CF_URL" ]; then
            echo "1. 🌐 **[Open via Cloudflare]($CF_URL)** (\`$CF_URL\`)" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "$PINGGY_URL" ]; then
            echo "2. 🚀 **[Open via Pinggy (Instant / No DNS wait)]($PINGGY_URL)** (\`$PINGGY_URL\`)" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "$LT_URL" ]; then
            echo "3. ⚡ **[Open via Localtunnel]($LT_URL)** (\`$LT_URL\`)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Duration**: \`${{ inputs.run_duration_hours }} hour(s)\`" >> $GITHUB_STEP_SUMMARY

      - name: Keep Runner Alive
        run: |
          DURATION_SECONDS=$(( ${{ inputs.run_duration_hours }} * 3600 ))
          echo "⏳ MiroFish will run on GitHub Actions for ${{ inputs.run_duration_hours }} hour(s) ($DURATION_SECONDS seconds)..."
          echo "ℹ️ You can stop this run anytime from the GitHub Actions tab by clicking 'Cancel workflow'."
          
          # Stream backend logs in real-time to workflow console
          tail -n +1 -F backend.log &
          TAIL_PID=$!

          END_TIME=$(( $(date +%s) + DURATION_SECONDS ))
          while [ $(date +%s) -lt $END_TIME ]; do
            # Check backend & frontend status
            if ! pgrep -f "run.py" > /dev/null; then
              echo "⚠️ Backend stopped!"
              break
            fi
            sleep 30
          done
          kill $TAIL_PID 2>/dev/null || true
          echo "🏁 Run duration completed."

      - name: Save Persistent Data Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: backend/uploads
          key: mirofish-data-${{ github.run_id }}

      - name: Upload Persistent Data Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirofish-data
          path: backend/uploads
          retention-days: 30

      - name: Upload Logs on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirofish-runtime-logs
          path: |
            backend.log
            frontend.log
            cf.log
            pinggy.log
            lt.log
          retention-days: 3
