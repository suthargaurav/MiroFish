name: Build and push Docker image

on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the image (default-branch runs only)
        required: false
        default: false
        type: boolean
      platforms:
        description: 'Target platforms (default linux/amd64 for fast 2-minute build; use linux/amd64,linux/arm64 for multi-arch)'
        required: false
        default: 'linux/amd64'
        type: string

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

env:
  SHOULD_PUBLISH: ${{ github.event_name == 'push' || (inputs.publish && github.ref_name == github.event.repository.default_branch) }}
  PLATFORMS: ${{ inputs.platforms || (github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64') }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: contains(env.PLATFORMS, 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.SHOULD_PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mirofish
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ env.SHOULD_PUBLISH == 'true' }}
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
